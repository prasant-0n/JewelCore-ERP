apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jewelcore.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jewelcore.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PORT: {{ .Values.config.port | quote }}
  DB_HOST: "{{ include "jewelcore.fullname" . }}-postgres"
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.postgresql.database | quote }}
  DB_USER: {{ .Values.postgresql.user | quote }}
  DB_SSL: "false"
  REDIS_HOST: "{{ include "jewelcore.fullname" . }}-redis"
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  JWT_EXPIRES_IN: {{ .Values.config.jwtExpiresIn | quote }}
  JWT_REFRESH_EXPIRES_IN: {{ .Values.config.jwtRefreshExpiresIn | quote }}
