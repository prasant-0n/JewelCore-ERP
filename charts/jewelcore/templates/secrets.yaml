apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jewelcore.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jewelcore.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64-encoded default demonstration secrets (override via external secret store or CI/CD)
  DB_PASSWORD: {{ "jewelcore_secret_password" | b64enc | quote }}
  JWT_SECRET: {{ "jewelcore_jwt_super_secret_signing_key_32bytes" | b64enc | quote }}
  JWT_REFRESH_SECRET: {{ "jewelcore_refresh_secret_key_32bytes_prod" | b64enc | quote }}
  BACKUP_ENCRYPTION_SECRET: {{ "jewelcore_aes256_cbc_backup_passphrase_key" | b64enc | quote }}
