# Development environment profile
global:
  environment: development
  domain: jewelcore.local
  imagePullPolicy: Never

config:
  nodeEnv: development
  logLevel: debug

postgresql:
  storage:
    size: 10Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

api:
  replicas: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  replicas: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  tls:
    enabled: false
  hosts:
    web: app.jewelcore.local
    api: api.jewelcore.local
    portal: portal.jewelcore.local

backup:
  enabled: false
