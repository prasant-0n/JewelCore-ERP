apiVersion: v1
kind: Service
metadata:
  name: jewelcore-postgres
  namespace: jewelcore
  labels:
    app.kubernetes.io/name: jewelcore-postgres
spec:
  ports:
    - port: 5432
      name: postgresql
      targetPort: 5432
  clusterIP: None
  selector:
    app: jewelcore-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jewelcore-postgres
  namespace: jewelcore
  labels:
    app: jewelcore-postgres
    app.kubernetes.io/name: jewelcore-postgres
spec:
  serviceName: "jewelcore-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: jewelcore-postgres
  template:
    metadata:
      labels:
        app: jewelcore-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: jewelcore-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jewelcore-secrets
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jewelcore-secrets
                  key: DATABASE_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
