apiVersion: v1
kind: Service
metadata:
  name: jewelcore-redis
  namespace: jewelcore
  labels:
    app.kubernetes.io/name: jewelcore-redis
spec:
  ports:
    - port: 6379
      name: redis
      targetPort: 6379
  selector:
    app: jewelcore-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jewelcore-redis
  namespace: jewelcore
  labels:
    app: jewelcore-redis
    app.kubernetes.io/name: jewelcore-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jewelcore-redis
  template:
    metadata:
      labels:
        app: jewelcore-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          emptyDir: {}
