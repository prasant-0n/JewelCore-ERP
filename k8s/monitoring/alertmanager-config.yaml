global:
  resolve_timeout: 5m
  pagerduty_url: "https://events.pagerduty.com/v2/enqueue"

route:
  group_by: ["alertname", "cluster", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "slack-notifications"
  routes:
    # Route critical production outages to PagerDuty 24/7 on-call
    - match:
        severity: critical
        pagerduty: "true"
      receiver: "pagerduty-critical-oncall"
      continue: true

    # Route warnings to Slack atelier SRE war-room
    - match:
        severity: warning
      receiver: "slack-notifications"

receivers:
  - name: "slack-notifications"
    slack_configs:
      - channel: "#atelier-erp-alerts"
        api_url: "${SLACK_ALERT_WEBHOOK_URL}"
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
            *Description:* {{ .Annotations.description }}
            *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
            {{ end }}
          {{ end }}

  - name: "pagerduty-critical-oncall"
    pagerduty_configs:
      - routing_key: "0192e300-pagerduty-production-routing-key"
        send_resolved: true
        severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}error{{ end }}'
        description: '{{ .CommonAnnotations.summary }} - {{ .CommonAnnotations.description }}'
        client: "JewelCore Alertmanager Cluster"
        client_url: "https://prometheus.jewelcore.internal"
