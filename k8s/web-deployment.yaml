apiVersion: v1
kind: Service
metadata:
  name: jewelcore-web
  namespace: jewelcore
  labels:
    app.kubernetes.io/name: jewelcore-web
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: jewelcore-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jewelcore-web
  namespace: jewelcore
  labels:
    app: jewelcore-web
    app.kubernetes.io/name: jewelcore-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jewelcore-web
  template:
    metadata:
      labels:
        app: jewelcore-web
    spec:
      containers:
        - name: web
          image: jewelcore-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: jewelcore-config
                  key: NEXT_PUBLIC_API_URL
            - name: NEXT_PUBLIC_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: jewelcore-config
                  key: NEXT_PUBLIC_WS_URL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jewelcore-web-hpa
  namespace: jewelcore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jewelcore-web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
