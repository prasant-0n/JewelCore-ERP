services:
  # ==============================================================================
  # JewelCore ERP - Core Backend API (Zero-Cost PaaS / Render Free Tier)
  # ==============================================================================
  - type: web
    name: jewelcore-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jewelcore/shared build && pnpm --filter @jewelcore/database build && pnpm --filter @jewelcore/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
