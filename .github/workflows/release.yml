name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jewelcore
          POSTGRES_PASSWORD: jewelcore_dev
          POSTGRES_DB: jewelcore_erp
        ports:
          - 5434:5432
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5434
      POSTGRES_USER: jewelcore
      POSTGRES_PASSWORD: jewelcore_dev
      POSTGRES_DB: jewelcore_erp
      DATABASE_URL: postgres://jewelcore:jewelcore_dev@localhost:5434/jewelcore_erp
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      REDIS_URL: redis://127.0.0.1:6380
      NODE_ENV: test
      JWT_SECRET: jewelcore-test-jwt-secret-key-32-chars-long!
      PORT: 4000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Monorepo Typecheck
        run: pnpm run typecheck

      - name: Monorepo Build
        run: pnpm run build

      - name: Database Schema Seeding & Vitest Verification
        run: |
          pnpm run db:seed
          pnpm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: JewelCore ERP Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
