name: JewelCore Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: 🔍 TypeScript Strict Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Packages
        run: pnpm run build:packages

      - name: Monorepo Typecheck (0 Errors Enforced)
        run: pnpm run typecheck

  backend-integration:
    name: 🧪 Vitest Integration & Statutory Engines (888 Tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jewelcore
          POSTGRES_PASSWORD: jewelcore_dev
          POSTGRES_DB: jewelcore_erp
        ports:
          - 5434:5432
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5434
      POSTGRES_USER: jewelcore
      POSTGRES_PASSWORD: jewelcore_dev
      POSTGRES_DB: jewelcore_erp
      DATABASE_URL: postgres://jewelcore:jewelcore_dev@localhost:5434/jewelcore_erp
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      REDIS_URL: redis://127.0.0.1:6380
      NODE_ENV: test
      JWT_SECRET: jewelcore-test-jwt-secret-key-32-chars-long!
      PORT: 4000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Packages
        run: pnpm run build:packages

      - name: Database Schema Provisioning & Multi-Tenant Seeding
        run: pnpm run db:seed

      - name: Execute Vitest Integration Suite
        run: pnpm test

  e2e-workstation-verification:
    name: 🎭 Playwright E2E Workstation Matrix (154 Tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jewelcore
          POSTGRES_PASSWORD: jewelcore_dev
          POSTGRES_DB: jewelcore_erp
        ports:
          - 5434:5432
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5434
      POSTGRES_USER: jewelcore
      POSTGRES_PASSWORD: jewelcore_dev
      POSTGRES_DB: jewelcore_erp
      DATABASE_URL: postgres://jewelcore:jewelcore_dev@localhost:5434/jewelcore_erp
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      REDIS_URL: redis://127.0.0.1:6380
      NODE_ENV: test
      JWT_SECRET: jewelcore-test-jwt-secret-key-32-chars-long!
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with System Dependencies
        run: pnpm --filter "@jewelcore/web" exec playwright install --with-deps chromium

      - name: Build Web Application & Packages
        run: pnpm run build

      - name: Database Schema Provisioning & Seeding
        run: pnpm run db:seed

      - name: Execute Complete Playwright E2E Browser Suite
        run: pnpm run test:e2e

      - name: Upload E2E Test Report Artifact (on failure)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-e2e-report
          path: apps/web/playwright-report/
          retention-days: 7

  production-build:
    name: 🏗️ Production Monorepo Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Monorepo Production Build
        run: pnpm run build
